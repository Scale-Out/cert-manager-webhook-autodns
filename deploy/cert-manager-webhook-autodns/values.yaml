# The GroupName here is used to identify your company or business unit that
# created this webhook.
# This name must be referenced in each Issuer's `webhook` stanza so cert-manager
# knows where to send ChallengePayload resources for DNS01 challenges.
groupName: acme.example.com

certManager:
  namespace: cert-manager
  serviceAccountName: cert-manager

replicaCount: 1

image:
  repository: ghcr.io/scale-out/cert-manager-webhook-autodns
  tag: ""  # defaults to .Chart.AppVersion
  pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: ""

service:
  type: ClusterIP
  port: 443

# Names of Secrets in the release namespace that the webhook must read for
# AutoDNS credentials. Each ClusterIssuer config references one of these via
# usernameSecretRef/passwordSecretRef.
secretRefs:
  - autodns-credentials

resources: {}

nodeSelector: {}

tolerations: []

affinity: {}
