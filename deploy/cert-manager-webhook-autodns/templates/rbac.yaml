apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "cert-manager-webhook-autodns.fullname" . }}
  labels:
    app: {{ include "cert-manager-webhook-autodns.name" . }}
    chart: {{ include "cert-manager-webhook-autodns.chart" . }}
    release: {{ .Release.Name }}
    heritage: {{ .Release.Service }}
---
# Grant the webhook permission to read the ConfigMap containing the Kubernetes
# apiserver's requestheader-ca-certificate.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "cert-manager-webhook-autodns.fullname" . }}:webhook-authentication-reader
  namespace: kube-system
  labels:
    app: {{ include "cert-manager-webhook-autodns.name" . }}
    chart: {{ include "cert-manager-webhook-autodns.chart" . }}
    release: {{ .Release.Name }}
    heritage: {{ .Release.Service }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: extension-apiserver-authentication-reader
subjects:
  - apiGroup: ""
    kind: ServiceAccount
    name: {{ include "cert-manager-webhook-autodns.fullname" . }}
    namespace: {{ .Release.Namespace }}
---
# apiserver gets the auth-delegator role to delegate auth decisions to
# the core apiserver
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "cert-manager-webhook-autodns.fullname" . }}:auth-delegator
  labels:
    app: {{ include "cert-manager-webhook-autodns.name" . }}
    chart: {{ include "cert-manager-webhook-autodns.chart" . }}
    release: {{ .Release.Name }}
    heritage: {{ .Release.Service }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
subjects:
  - apiGroup: ""
    kind: ServiceAccount
    name: {{ include "cert-manager-webhook-autodns.fullname" . }}
    namespace: {{ .Release.Namespace }}
---
# Grant cert-manager permission to invoke our solver API
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "cert-manager-webhook-autodns.fullname" . }}:domain-solver
  labels:
    app: {{ include "cert-manager-webhook-autodns.name" . }}
    chart: {{ include "cert-manager-webhook-autodns.chart" . }}
    release: {{ .Release.Name }}
    heritage: {{ .Release.Service }}
rules:
  - apiGroups:
      - {{ .Values.groupName }}
    resources:
      - '*'
    verbs:
      - 'create'
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "cert-manager-webhook-autodns.fullname" . }}:domain-solver
  labels:
    app: {{ include "cert-manager-webhook-autodns.name" . }}
    chart: {{ include "cert-manager-webhook-autodns.chart" . }}
    release: {{ .Release.Name }}
    heritage: {{ .Release.Service }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "cert-manager-webhook-autodns.fullname" . }}:domain-solver
subjects:
  - apiGroup: ""
    kind: ServiceAccount
    name: {{ .Values.certManager.serviceAccountName }}
    namespace: {{ .Values.certManager.namespace }}
---
# Grant the webhook permission to read the AutoDNS credentials secret(s) in the
# release namespace. resourceNames whitelist comes from values.secretRefs.
{{- if .Values.secretRefs }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "cert-manager-webhook-autodns.fullname" . }}:secret-reader
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ include "cert-manager-webhook-autodns.name" . }}
    chart: {{ include "cert-manager-webhook-autodns.chart" . }}
    release: {{ .Release.Name }}
    heritage: {{ .Release.Service }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames:
{{ toYaml .Values.secretRefs | indent 6 }}
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "cert-manager-webhook-autodns.fullname" . }}:secret-reader
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ include "cert-manager-webhook-autodns.name" . }}
    chart: {{ include "cert-manager-webhook-autodns.chart" . }}
    release: {{ .Release.Name }}
    heritage: {{ .Release.Service }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "cert-manager-webhook-autodns.fullname" . }}:secret-reader
subjects:
  - apiGroup: ""
    kind: ServiceAccount
    name: {{ include "cert-manager-webhook-autodns.fullname" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
